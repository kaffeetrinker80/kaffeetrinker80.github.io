name: Auto-Changelog

on:
  push:
    branches: [main]
    paths-ignore:
      - "changelog.json"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: changelog.json aktualisieren
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: python .github/scripts/build_changelog.py

      - name: Änderungen committen
        run: |
          if git diff --quiet -- changelog.json; then
            echo "Keine Änderung am Changelog."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git commit -m "chore: auto-changelog [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
