name: Auto-Changelog

# Die Tools liegen in eigenen Repos (theocratic, worktools, private, nova).
# Deshalb schaut diese Action regelmäßig dort nach, statt auf Pushes hier zu warten.
on:
  schedule:
    - cron: "17 * * * *"   # stündlich (GitHub kann das um einige Minuten verzögern)
  workflow_dispatch:        # manuell: Actions → Auto-Changelog → Run workflow

permissions:
  contents: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Python 3 ist auf dem Runner schon vorinstalliert – kein setup-python nötig
      - name: Tool-Repos prüfen und changelog.json aktualisieren
        run: python3 .github/scripts/build_changelog.py

      - name: Änderungen committen
        run: |
          git add changelog.json .github/changelog-state.json
          if git diff --cached --quiet; then
            echo "Nichts Neues."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: auto-changelog"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
